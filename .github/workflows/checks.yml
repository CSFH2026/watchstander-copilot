# Runs on every pull request and on main.
# Branches named ui/... are for the UI pair and may only change files under ui/.
name: checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install
        run: python -m venv api/.venv && api/.venv/bin/pip install -q -r api/requirements.txt
      # The tests run offline like the laptop does, so the model must be in api/models first.
      - uses: actions/cache@v4
        id: model
        with:
          path: api/models
          key: model-bge-small-en-v1.5-${{ hashFiles('api/requirements.txt') }}
      - name: Download model
        if: steps.model.outputs.cache-hit != 'true'
        run: cd api && .venv/bin/python -c "from retrieval.embed import model; model()"
      - name: Test
        run: make test

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # ui/ is not on main until the UI pull request merges.
      - id: has-ui
        run: test -f ui/package.json && echo "present=true" >> "$GITHUB_OUTPUT" || echo "No ui/ on this branch, skipping."
      - uses: actions/setup-node@v5
        if: steps.has-ui.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install, lint, typecheck, build
        if: steps.has-ui.outputs.present == 'true'
        working-directory: ui
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

  ui-fence:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'ui/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Only ui/ files changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          outside=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -v '^ui/' || true)
          if [ -n "$outside" ]; then
            echo "This ui/ branch changes files outside ui/:"
            echo "$outside"
            echo "Move those changes to a separate pull request, or open an issue for the owning lane."
            exit 1
          fi
          echo "All changes are under ui/."
