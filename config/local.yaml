# Laptop preset. This is the judged demo: every model runs on this machine and nothing calls out.
# Pick a preset with WSC_CONFIG=config/<name>.yaml; this file is the default.
target: local                  # local | cloudflare
corpus: corpus                 # folder of ship-class subfolders, relative to the repo root
operators: [EOOW-01, EOOW-02]

models:                        # provider: local | cloudflare | "off"
  embed:      {provider: local, model: BAAI/bge-small-en-v1.5}
  transcribe: {provider: "off"}  # issue 21 adds faster-whisper base.en
  rewrite:    {provider: "off"}  # issue 7 adds qwen2.5:3b through Ollama
  rerank:     {provider: "off"}  # stretch goal

# Tuned for this embed model. Rerun tests/test_scope_offtopic.py after any change here or in the corpus.
retrieval:
  rrf_k: 60
  ambiguous_ratio: 0.94
  min_cosine: 0.55
  min_cosine_without_keywords: 0.62

local:
  host: 127.0.0.1
  port: 8000
  ollama_url: http://127.0.0.1:11434
