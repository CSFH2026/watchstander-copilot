# Cloudflare preset. A test build for frontend work: Pages serves the UI, Pages Functions answer /api,
# D1 holds the audit log, and Workers AI runs the models. It is never the demo: use case 21 requires zero cloud.
# Secrets never go in this file. See docs/HOSTING.md.
target: cloudflare
dataset: wikihow              # a folder under corpus/ with a dataset.yaml; WSC_DATASET=ddg switches it
operators: [EOOW-01, EOOW-02]

models:                        # a cloudflare target accepts only cloudflare or off
  embed:      {provider: cloudflare, model: "@cf/baai/bge-small-en-v1.5"}
  transcribe: {provider: "off"}
  rewrite:    {provider: "off"}
  rerank:     {provider: "off"}

# Defaults for this model. Each dataset's dataset.yaml may override them under retrieval.cloudflare.
retrieval:
  rrf_k: 60
  ambiguous_ratio: 0.94
  min_cosine: 0.55
  min_cosine_without_keywords: 0.62

cloudflare:
  account_id: ""                # empty = the account wrangler is logged in to
  pages_project: watchstander-copilot-preview
  d1_database: watchstander-copilot-db
