# Naval or plant questions that no ddg procedure covers. Each must be refused, not answered with a near miss.
  EOCC-GALY-URN:
    - the coffee maker in the galley is down
    - coffee urn won't heat up, no hot coffee for the watch
refused:
  - low lube oil pressure on number two SSDG
  - EDG will not start
  - emergency diesel generator overspeed
  - boiler water level out of sight
  - main condenser losing vacuum
  - steam turbine vibration
  - catapult will not retract
  - arresting gear cable parted
  - sonar dome rubber window damaged
  - outboard motor on the RHIB will not start
  - how do I request leave
  - what time is chow
  - where is the ship's store
  - how do I fill out an evaluation
  - what is the uniform of the day
  - schedule a haircut
  - how to tie a bowline
  - check out a library book
  - plan liberty in Norfolk
  - submit a travel claim
  - pizza for lunch
  - tell me a joke
  - change the oil in my truck
  - fix a leaky faucet at home
  - how do I reset my email password
  - weather forecast for tomorrow
  - Mk 45 gun misfire
  - VLS cell hatch will not open
  - SPY radar will not radiate
  - man overboard port side
  - galley oven not heating
  - ship's laundry washing machine broken
  - how to stand a lookout watch
  - bridge radar repeater is blank
  - boat davit will not lower the RHIB

# Naval questions outside the corpus that the gate still answers, measured 2026-11-05. Each shares a word
# with a real procedure (brake, rig, lighting) and scores above the cosine floor. scripts/eval_ddg.py reports
# them; tests/test_dataset_ddg.py expects them to fail, so a fix shows up as an unexpected pass.
near_miss:
  - anchor windlass brake slipping
  - rig the accommodation ladder
  - flight deck lighting failed

# Covered questions that miss their procedure, measured 2026-11-05: the answer is a wrong procedure marked
# clear, or the right one is not in the top two. Most are real overlaps (overspeed against governor
# failure, a GTM fire against an SSGTG fire). tests/test_dataset_ddg.py expects them to fail, so a corpus
# change that fixes one shows up as an unexpected pass and the line comes out.
known_misses:
  - gas turbine generator running away, frequency climbing
  - number 3 gas turbine generator module fire
  - SSGTG lost excitation
  - we lost one of the two online generators
  - SSGTG carrying more than rated kW
  - rig casualty power to the steering gear
  - LPAC discharge temperature high
  - high pressure air compressor failed
