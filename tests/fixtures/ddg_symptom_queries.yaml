# Watchstander questions for the ddg dataset. Each one must find its procedure.
# Written from the procedure titles only, before the symptom lists were read, so a pass means the
# retriever understood the question and not that the test copied the corpus wording.
# Phrasing mixes what a Sailor says on the sound-powered phone with what the console shows.
# Two questions were rewritten when the sources narrowed a title: GTM-CLTH covers only the PT brake (the
# source gives no clutch failure actions), and STR-HRAM became a ram seal leak.
covered:
  EOCC-GTM-FTLO:
    - number 2A GTM cranks but never lights off
    - gas turbine turns over on start but no ignition, no light off
  EOCC-GTM-NSTR:
    - 1B GTM will not crank, no rotation on start
    - main engine starter gets no air, LM2500 won't turn over
  EOCC-GTM-HVIB:
    - high vibration alarm on the 1A gas turbine
    - power turbine vibration reading high on GTM 2B
  EOCC-GTM-PTOS:
    - power turbine overspeed trip on 2A GTM
    - GTM tripped on PT overspeed
  EOCC-GTM-LLOP:
    - lube oil pressure low on the 1B LM2500
    - GTM lube oil supply pressure dropping
  EOCC-GTM-HSCV:
    - GTM scavenge oil temperature high
    - high lube oil scavenge temp on the 2A main engine
  EOCC-GTM-FIRE:
    - fire in the 1A GTM enclosure, flame detector alarm
    - module fire alarm on the main gas turbine
  EOCC-GTM-HTIT:
