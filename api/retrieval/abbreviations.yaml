# Expands plant shorthand before search, at index time and at query time, so "LO" and "lube oil" match.
# Lane 2 owns this list. Add a line when a test query misses because of shorthand.
SSDG: ship service diesel generator
GTG: gas turbine generator
EDG: emergency diesel generator
MRG: main reduction gear
EOOW: engineering officer of the watch
EPT: engineering plant technician
PACC: propulsion and auxiliary control console
EPCC: electric plant control console
CCS: central control station
AMR: auxiliary machinery room
EOSS: engineering operational sequencing system
EOP: engineering operational procedures
EOCC: engineering operational casualty control
LO: lube oil
FO: fuel oil
JW: jacket water
FW: fresh water
SW: sea water
psig: pounds per square inch gauge
