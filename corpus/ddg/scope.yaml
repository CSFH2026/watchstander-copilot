# What the corpus covers. Update it with every new ship class or equipment.
# A question that names uncovered equipment gets "no authorized procedure" instead of a near miss.

# Naming one of these keeps a question in scope even if it also names other equipment.
covered:
  - ssdg
  - ship service diesel generator
  - ship service generator
  - ship's service generator

# Equipment we hold no procedure for yet.
uncovered:
  - gas turbine generator
  - gas turbine
  - gtg
  - lm2500
  - main reduction gear
  - reduction gear
  - mrg
  - emergency diesel generator
  - edg
  - boiler
  - steering gear
  - air compressor
  - refrigeration
  - air conditioning
  - shaft
  - propeller

# Words too common to prove a question is about a plant casualty on their own.
# "oil pressure" together still counts, because two-word phrases from the symptoms are checked too.
generic:
  - oil
  - pressure
  - water
  - high
  - low
  - temperature
  - temp
  - level
  - loss
  - reads
  - read
  - gauge
  - alarm
  - above
  - below
  - increases
  - noise
  - failure
  - reduced
  - possible
  - unable
  - carry
  - load
  - power
  - system
  - check
  # Cause words that matched everyday questions ("command line", "remote control") in the off-topic test.
  - line
  - down
  - remote
  - restricted
  - broken
  - only
