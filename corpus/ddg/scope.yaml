# What the corpus covers. Update it with every new ship class or equipment.
# A question that names uncovered equipment gets "no authorized procedure" instead of a near miss.

# Naming one of these keeps a question in scope even if it also names other equipment.
# Only plant names go here: an everyday word such as "air conditioning" would let home questions past the gate.
covered:
  - ssgtg
  - ship service gas turbine generator
  - gas turbine generator
  - gtg
  - gtgs
  - gtm
  - gas turbine module
  - lm2500
  - main reduction gear
  - mrg
  - crp
  - controllable reversible pitch
  - od box
  - hopm
  - steering gear
  - after steering
  - firemain
  - epcc
  - pacc
  - plcc
  - locop
  - main engine room
  - auxiliary machinery room
  - lpac
  - hpac
  - ro unit
  - a/c plant
  - chilled water
  - ship's service switchboard
  - ic switchboard
  - casualty power

# Equipment a DDG-51 does not have, or that we hold no procedure for.
# A DDG has gas turbine generators, so a diesel generator question is about another ship class.
uncovered:
  - ship service diesel generator
  - ssdg
  - emergency diesel generator
  - edg
  - diesel generator
  - diesel engine
  - boiler
  - main condenser
  - steam turbine
  - reactor
  - catapult
  - arresting gear
  - aircraft elevator
  - sonar dome
  - outboard motor

# Words too common to prove a question is about a plant casualty on their own.
# "oil pressure" together still counts, because two-word phrases from the symptoms are checked too.
